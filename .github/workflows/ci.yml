name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  astro-unit-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: astro-app/package-lock.json

      - name: Install dependencies
        working-directory: astro-app
        run: npm ci

      - name: Security audit
        working-directory: astro-app
        run: npm audit --audit-level=high

      - name: Run tests
        working-directory: astro-app
        run: npx vitest run

      - name: Build Astro app
        working-directory: astro-app
        run: npm run build

  astro-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: astro-unit-build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: astro-app/package-lock.json

      - name: Install dependencies
        working-directory: astro-app
        run: npm ci

      - name: Install Playwright browser
        working-directory: astro-app
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: astro-app
        run: npm run test:e2e

  extension-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        extension:
          - chrome-extensions/property-scraper
          - chrome-extensions/bulk-scraper

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.extension }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.extension }}
        run: npm ci

      - name: Run extension tests
        working-directory: ${{ matrix.extension }}
        run: npm test
